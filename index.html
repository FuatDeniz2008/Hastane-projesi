<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hastane Hasta Kayit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Hastane Hasta Kayit Sistemi</h1>
<form id="form">
<input type="text" id="ad" placeholder="Hasta Adi Soyadi" required>
<input type="text" id="tc" placeholder="TC Kimlik No" required maxlength="11">
<select id="bolum" required>
<option value="">Bolum Secin</option>
<option>Dahiliye</option>
<option>Kardiyoloji</option>
<option>Ortopedi</option>
<option>Goz</option>
</select>
<input type="date" id="tarih" required>
<input type="time" id="saat" required>
<button type="submit">Hasta Kaydet</button>
</form>
<input type="text" id="search" placeholder="Ara..." onkeyup="ara()">
<table>
<thead><tr><th>Ad</th><th>TC</th><th>Bolum</th><th>Tarih</th><th>Saat</th><th>Sil</th></tr></thead>
<tbody id="liste"></tbody>
</table>
<p>Toplam Hasta: <span id="sayac">0</span></p>
</div>
<script src="script.js"></script>
</body>
</html>
